on:
  issues:
    types: [opened, edited]
jobs:
  checkProject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        name: Check for StackBlitz or Bolt reproduction link
        id: linear-check
        with:
          script: |
            const issue = await github.rest.issues.get({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const regexp = /https:\/\/(stackblitz\.com|bolt\.new)\/(?:(?:~|c)\/)?(?<slug>[a-zA-Z0-9-]+)/i;

            const match = issue.data.body.match(regexp);

            const slug = match?.groups?.slug;

            if (!slug) {
              console.log('IT SHOULD COMMENT!');

              // if no slug is found, we can assume that the user did not provide a StackBlitz or Bolt reproduction link
              await comment('We noticed that you did not provide a StackBlitz or Bolt reproduction link. Please update the issue and add a link to a StackBlitz or Bolt reproduction link.');

              return;
            }

            const response = await fetch(`https://stackblitz.com/api/projects/${slug}`, {
              method: 'HEAD',
            });

            if (!response.ok) {
              // if the response is not ok, we can assume that the project is not public
              await comment('We noticed that the project you shared is not public. Please change the visibility of the project to either secret or public.');

              return;
            }

            // if the response is ok, we can assume that the project is public and we can remove the label in case it was added before
            await github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'needs reproduction',
            });

            async function comment(body) {
              const result = await Promise.allSettled([
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body,
                }),
                github.rest.issues.addLabels({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: ['needs reproduction'],
                })
              ]);

              console.log(result[0]);
            }

